# Bootstrap template for SearXNG.
# scripts/install-openclaw-podman.sh copies this file to ~/.config/searxng/settings.yml
# and replaces CHANGE_ME_SEARXNG_SECRET with a generated secret key.

use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "CHANGE_ME_SEARXNG_SECRET"
  base_url: "http://127.0.0.1:8080/"
  image_proxy: true
  limiter: false

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  useragent_suffix: "openclaw-podman-quickstart"
