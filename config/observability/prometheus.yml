global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:3100

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:12345

  - job_name: podman
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9882
